name: securedev-jenkins-ev3

services:
  jenkins:
    build: .
    container_name: securedev-jenkins-ev3
    user: root
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home:
